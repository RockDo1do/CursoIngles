<style>
/* Layout: uma coluna estilo webtoon (rolagem vertical), painéis separados por calhas escuras; janelas da Torre em ciano */
:root{
  --ink:#0f0e17; --ink-2:#1a1826; --line:#2c2940;
  --text:#ece9f5; --muted:#a39fba;
  --paper:#fcfbf8; --paper-ink:#16141f; --paper-muted:#5d5873;
  --sys:#62d6ff; --sys-bg:#0b1b31;
  --accent:#ff8a3d;--accent-ink:#ff8a3d; --good:#3fd68a; --bad:#ff5d73;
  --cap:#ffe7a3; --cap-ink:#2a2210;
  --f-display:'Lilita One',Impact,'Arial Black',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-bubble:'Fredoka','Atkinson Hyperlegible',system-ui,sans-serif;
  --f-sys:'DotGothic16',ui-monospace,Menlo,monospace;
  --sys-text:#ffffff; --sys-soft:#cfe9f7; --tip-text:#ffd9bf; --ok-text:#c9ffe2; --no-text:#ffd0d8; --bar-bg:rgba(15,14,23,.95);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ink:#f3f1f8;--ink-2:#ffffff;--line:#d9d4e8;--text:#1b1830;--muted:#5d5873;--sys:#0a76a6;--sys-bg:#eef8fd;--accent:#e0661a;--accent-ink:#a8470b;--good:#118a55;--bad:#c02a47;--sys-text:#0c2533;--sys-soft:#2e5568;--tip-text:#8a3b0a;--ok-text:#0b5c39;--no-text:#8f1c31;--bar-bg:rgba(243,241,248,.95);color-scheme:light;}}
:root[data-theme="light"]{--ink:#f3f1f8;--ink-2:#ffffff;--line:#d9d4e8;--text:#1b1830;--muted:#5d5873;--sys:#0a76a6;--sys-bg:#eef8fd;--accent:#e0661a;--accent-ink:#a8470b;--good:#118a55;--bad:#c02a47;--sys-text:#0c2533;--sys-soft:#2e5568;--tip-text:#8a3b0a;--ok-text:#0b5c39;--no-text:#8f1c31;--bar-bg:rgba(243,241,248,.95);color-scheme:light;}
:root[data-look="light"]{--ink:#f3f1f8;--ink-2:#ffffff;--line:#d9d4e8;--text:#1b1830;--muted:#5d5873;--sys:#0a76a6;--sys-bg:#eef8fd;--accent:#e0661a;--accent-ink:#a8470b;--good:#118a55;--bad:#c02a47;--sys-text:#0c2533;--sys-soft:#2e5568;--tip-text:#8a3b0a;--ok-text:#0b5c39;--no-text:#8f1c31;--bar-bg:rgba(243,241,248,.95);color-scheme:light;}
:root[data-look="dark"]{--ink:#0f0e17;--ink-2:#1a1826;--line:#2c2940;--text:#ece9f5;--muted:#a39fba;--sys:#62d6ff;--sys-bg:#0b1b31;--accent:#ff8a3d;--accent-ink:#ff8a3d;--good:#3fd68a;--bad:#ff5d73;--sys-text:#ffffff;--sys-soft:#cfe9f7;--tip-text:#ffd9bf;--ok-text:#c9ffe2;--no-text:#ffd0d8;--bar-bg:rgba(15,14,23,.95);color-scheme:dark;}
:root[data-calm] *{animation:none!important;transition:none!important}
:root[data-calm] .bg-action{background:#ece8fb}
:root[data-calm] .sysw{box-shadow:none}
html,body{background:var(--ink)}
body{color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{zoom:var(--zoom,1);max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.bubble:focus-visible,.en-say:focus-visible{outline:3px solid var(--sys);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}

/* ---------- Painéis ---------- */
.panel{position:relative;overflow:hidden;border:3px solid #000;border-radius:3px;min-height:220px;padding:16px 14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.panel.has-chr{padding-bottom:178px}
.panel>*{position:relative;z-index:2}
.chr{position:absolute;bottom:-4px;width:150px;height:188px;z-index:1}
.chr.l{left:6px}
.chr.r{right:6px;transform:scaleX(-1)}
.chr.mon{width:190px;height:205px}
.cap{align-self:flex-start;max-width:92%;background:var(--cap);color:var(--cap-ink);border:2px solid #000;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.bubble{max-width:84%;background:var(--paper);color:var(--paper-ink);border:2.5px solid var(--paper-ink);border-radius:20px;padding:8px 84px 10px 14px;font-family:var(--f-bubble);font-size:20px;line-height:1.3;box-shadow:3px 3px 0 rgba(0,0,0,.4);cursor:pointer;position:relative;min-width:0}
.bubble.l{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.r{align-self:flex-end;border-bottom-right-radius:4px}
.bubble .who{display:block;font-family:var(--f-sys);font-size:11px;letter-spacing:.12em;color:var(--paper-muted)}
.bubble .pt{display:none;margin-top:6px;padding-top:6px;border-top:1.5px dashed #c9c4d9;font-family:var(--f-body);font-size:15px;color:var(--paper-muted)}
.bubble.open .pt,.showall .bubble .pt{display:block}
.bubble .hint{display:block;font-family:var(--f-body);font-size:11px;color:#625d78;margin-top:2px}
.bubble.open .hint,.showall .bubble .hint{display:none}
.bubble.mon{background:#2a1740;color:#ffd9e2;border-color:var(--bad);border-radius:6px}
.bubble.mon .who{color:#ff9db0}
.bubble.mon .pt{color:#e7b8c6;border-top-color:#6a3a5c}
.bubble.mon .hint{color:#8a4f69}
.bubble.thought{background:#e6e2f1;border-style:dashed;font-family:var(--f-body);font-style:italic;font-size:16px;padding-right:14px;cursor:default}
.say,.mic{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;background:transparent;display:grid;place-items:center;padding:0;opacity:.75}
.say:hover,.mic:hover{opacity:1}
.say svg,.mic svg{width:15px;height:15px}
.mic{right:44px}
.say::before,.mic::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.sw::before{content:"";position:absolute;inset:-9px -4px}
.say.speaking{opacity:1;background:var(--sys);color:#06202e;border-color:var(--sys)}
.rule .en-say.speaking{color:var(--sys)}
.bubble.listening{box-shadow:0 0 0 3px var(--bad),3px 3px 0 rgba(0,0,0,.4)}
.bubble.listening .mic{opacity:1;background:var(--bad);color:#fff;border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.bubble.listening .mic{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.14)}}}
.pron{margin-top:8px;padding:8px 10px;border-radius:10px;font-family:var(--f-body);font-size:14px;line-height:1.45;background:#eeebf6;color:var(--paper-ink);cursor:default}
.pron.ok{background:#e1f7ea}.pron.mid{background:#fff2d3}.pron.no,.pron.warn{background:#ffe4e9}.pron.info{background:#e3f2fb}
.pron .ph{font-size:15px}
.pron .pw{font-family:var(--f-bubble);font-size:18px;margin-top:2px}
.w-ok{color:#11744a}.w-no{color:#c0223e;text-decoration:underline wavy;text-underline-offset:3px}
/* tutorial: balões flutuantes */
#tour{position:fixed;inset:0;z-index:1000;pointer-events:none}
#tour .tour-block{position:fixed;inset:0;pointer-events:auto}
#tour.dim .tour-block{background:rgba(10,8,20,.62)}
#tour .tour-hole{position:fixed;border-radius:10px;border:3px solid var(--accent);box-shadow:0 0 0 200vmax rgba(10,8,20,.62);transition:top .25s,left .25s,width .25s,height .25s;pointer-events:none}
#tour .tour-tip{box-sizing:border-box;position:fixed;pointer-events:auto;background:var(--paper);color:var(--paper-ink);border:3px solid #000;border-radius:18px;padding:14px 16px 12px;box-shadow:4px 4px 0 #000;font-family:var(--f-body);transition:top .25s,left .25s}
#tour .tour-tip:focus{outline:none}
#tour .tour-n{font-family:var(--f-sys);font-size:11px;letter-spacing:.14em;color:var(--paper-muted);margin-bottom:4px}
#tour .tour-tip b{display:block;font-family:var(--f-bubble);font-size:20px;line-height:1.2;margin-bottom:4px}
#tour .tour-tip p{margin:0 0 12px;font-size:16px;line-height:1.45}
#tour .tour-act{display:flex;gap:8px;justify-content:flex-end}
#tour .tour-act .btn{padding:9px 16px;font-size:15px;min-height:44px}
#tour .tour-act .btn.ghost{color:var(--paper-ink);border-color:#bdb7cf}
#tour .tour-skip{display:block;margin:8px auto 0;color:var(--paper-muted);font-size:14px;min-height:32px}
#tour .tour-arr{position:absolute;width:18px;height:18px;background:var(--paper);border:3px solid #000;transform:translateX(-50%) rotate(45deg)}
#tour .tour-arr.up{top:-11px;border-right:0;border-bottom:0}
#tour .tour-arr.down{bottom:-11px;border-left:0;border-top:0}
#tour [hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){#tour .tour-hole,#tour .tour-tip{transition:none}}
:root[data-calm] #tour .tour-hole,:root[data-calm] #tour .tour-tip{transition:none}
#warm .wcap{font-family:var(--f-sys);font-size:11px;letter-spacing:.12em;color:var(--sys);margin-right:6px}
#warm .q{margin-top:12px}
.confd{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px}
.prod .ppedido{font-size:16px;margin:4px 0 8px}.prod .pmin{color:var(--muted);font-size:14px}
.prod .btn svg{width:18px;height:18px;vertical-align:-3px}
.prod .pprec{margin:0 0 10px;font-size:15px}.prod .pprec summary{cursor:pointer;color:var(--sys);min-height:32px}.prod .pprec ul{margin:6px 0 0;padding-left:20px}
.prod .pesc{margin-top:10px}.prod .ptxt{width:100%;box-sizing:border-box;font-size:17px;line-height:1.5;resize:vertical}
.prod .ptexto{border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0 10px;background:var(--card)}.prod .ptexto small{font-family:var(--f-sys);font-size:11px;letter-spacing:.12em;color:var(--muted)}.prod .ptexto p{margin:4px 0 0;font-size:17px}
.pcheck{list-style:none;padding:0;margin:8px 0}.pcheck li{margin:3px 0}.pcheck li.ok{color:var(--ok,#11744a)}.pcheck li.no{color:var(--no,#c0223e)}
.paviso{font-weight:700;margin:6px 0}.pouvi{margin:4px 0}.pmod{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}.pmtxt{font-size:17px;line-height:1.55}
.auto{list-style:none;padding:0;margin:8px 0}.auto li{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.auto li>span:first-child{flex:1 1 220px}.auto .segb{white-space:nowrap}
.fonte{padding:12px 0;border-bottom:1px solid var(--line)}.fonte:last-child{border-bottom:0}.fonte-t{display:flex;gap:10px;align-items:center;margin-bottom:6px}.fonte-t small{display:block;color:var(--muted);font-size:12px}.fonte-ic{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:18px}.fonte p{margin:4px 0}.fonte-como{font-size:14px}
.cvperg{padding-left:20px;margin:8px 0}.cvperg li{margin:6px 0}.cvfr{display:grid;gap:8px;margin-top:8px}.cvf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.cvf b{display:block}.cvf span{font-size:14px;color:var(--muted)}.cvf .say{position:static;flex:0 0 auto}
.imnivel{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:15px}
.immeta .imnum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}.immeta .imnum b{font-size:30px}.immeta .simbar{height:10px;margin-bottom:10px}.imdiv{margin:8px 0 0;padding-left:20px;font-size:14px}.imreg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.imreg .seg{margin:8px 0}.imantes{margin-top:12px}.imantes summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.imdicas{padding-left:20px;margin:6px 0}.imdicas li{margin:6px 0}.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.vgrp{margin:0 0 10px;border:2px solid var(--line);border-radius:14px;padding:4px 10px;background:var(--ink-2)}.vgrp>summary{cursor:pointer;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center;padding:10px 4px;min-height:44px;list-style:none}.vgrp>summary::-webkit-details-marker{display:none}.vgrp>summary b{font-size:17px}.vgrp>summary span{font-size:13px;color:var(--muted)}.vgrp>summary::after{content:'▾';font-size:14px;color:var(--muted)}.vgrp[open]>summary::after{content:'▴'}.vgrp .eps{margin-bottom:8px}
.sbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}.sbb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--ink-2);color:inherit;font:inherit;cursor:pointer;text-align:center;min-height:44px}.sbb b{font-size:24px;line-height:1.2;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}.sbb span{font-size:13px;font-weight:700}.sbb small{font-size:12px;opacity:.75}.sbb.vis{border-color:var(--good)}
.sbipa{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:56px;letter-spacing:.02em}
.simprog{display:flex;gap:6px;margin:6px 0 2px}.simprog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.simprog i.ok{background:var(--good)}.simprog i.on{background:var(--accent)}
.sopt{display:block;width:100%;text-align:left;padding:12px 14px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit;cursor:pointer;min-height:44px}.sopt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}.sopt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}.sopt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.sopt:disabled{cursor:default;opacity:1}
.simpartes{margin:8px 0;padding-left:22px}.simpartes li{margin:4px 0}
.simres{list-style:none;padding:0;margin:10px 0}.simres li{display:grid;grid-template-columns:minmax(120px,1fr) 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.simbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.simbar i{display:block;height:100%;background:var(--accent)}
.w-snd{color:#8a4b00;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px}
.pnotas{margin:6px 0 0;padding-left:18px;font-size:14px}.pnotas li{margin:2px 0}
.pron .ph2{color:var(--paper-muted);font-size:13px;margin-top:3px}
.pxp{font-family:var(--f-sys);color:#b04a08}
.aud{display:grid;gap:12px}
.aud-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.aud-row>div{min-width:0}
.aud small{display:block;font-family:var(--f-sys);font-size:11px;letter-spacing:.14em;color:var(--sys)}
.aud p{font-size:14px;color:var(--sys-soft);margin:2px 0 0}
.chip{font-family:var(--f-sys);font-size:13px;padding:3px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.chip.good{color:var(--good)}.chip.warn{color:var(--accent)}.chip.bad{color:var(--bad)}.chip.dim{color:var(--muted)}
.aud select{width:100%;background:var(--sys-bg);color:var(--sys-text);border:1.5px solid rgba(98,214,255,.45);border-radius:6px;padding:9px 10px;font:inherit;font-size:15px}
.aud select:focus-visible{outline:3px solid var(--sys);outline-offset:2px}
.aud .btn{padding:9px 14px;font-size:15px}

/* Cenários */
.bg-room{background:linear-gradient(180deg,#3b3052 0 64%,#4d3b33 64%)}
.bg-room::before{content:"";position:absolute;top:26px;right:22px;width:96px;height:76px;background:linear-gradient(#ffdca3,#ff9c7c);border:5px solid #241c33;opacity:.45;z-index:0}
.bg-street{background:linear-gradient(180deg,#ff9a6b 0%,#c0569a 48%,#3b2b6b 100%)}
.bg-street::before{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:#24193f;clip-path:polygon(0 30%,10% 30%,10% 12%,22% 12%,22% 40%,30% 40%,30% 0,42% 0,42% 26%,52% 26%,52% 8%,63% 8%,63% 34%,72% 34%,72% 16%,85% 16%,85% 38%,100% 38%,100% 100%,0 100%);z-index:0}
.bg-dungeon{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 42px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 84px),radial-gradient(circle at 50% 30%,#4c2a6c,#150c23 72%)}
.bg-cafe{background:radial-gradient(circle at 18% 14%,rgba(255,200,120,.5) 0 10px,transparent 34px),radial-gradient(circle at 52% 10%,rgba(255,200,120,.5) 0 10px,transparent 34px),radial-gradient(circle at 86% 16%,rgba(255,200,120,.5) 0 10px,transparent 34px),linear-gradient(180deg,#5c3b2a,#2b1c15)}

<body>
<div id="app"><p role="status" style="font:18px system-ui,sans-serif;color:#9a97b0;text-align:center;padding:48px 16px">Carregando a Torre…</p></div>

<script>
/* Carrega a história e as questões (pasta conteudo/) e depois o código do curso (app.js).
   TORRE_V muda sozinho a cada publicação (tools/site/build_site.py), para o aparelho baixar a versão nova. */
const TORRE_V='db81f5942c';
(async function(){
 const el=document.getElementById('app');
 function falha(e){
  console.error(e); window.TORRE_ERRO=String(e&&e.message||e);
  el.innerHTML='<div role="alert" style="font:17px system-ui,sans-serif;color:#e9e7f5;background:#1a1826;max-width:560px;margin:48px 16px;padding:8px 20px;border-radius:14px;line-height:1.5"><p><b>Não consegui carregar o curso.</b></p><p>Verifique a internet e tente de novo.</p><p><button onclick="location.reload()" style="font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:#ff8a3d;color:#111">Tentar de novo</button></p><p style="font-size:13px;color:#9a97b0"></p></div>';
  el.querySelector('p:last-child').textContent='Detalhe: '+window.TORRE_ERRO;
 }
 const get=async p=>{
  const r=await fetch('conteudo/'+p+'.json?v='+TORRE_V,{cache:'no-cache'});
  if(!r.ok) throw new Error('conteudo/'+p+'.json não abriu ('+r.status+')');
  try{return await r.json();}catch(e){throw new Error('conteudo/'+p+'.json tem um erro de formatação ('+e.message+')');}
 };
 /* junta cada capítulo da história com as questões dele (mesma posição e mesmo título) */
 const junta=(h,q,nome)=>{
  const caps=h.capitulos||[];
  if(!Array.isArray(q)||q.length!==caps.length) throw new Error(nome+': a história tem '+caps.length+' capítulos, mas as questões têm '+(Array.isArray(q)?q.length:0));
  return caps.map((c,i)=>{
   const x=q[i];
   if(x.capitulo!==c.t) throw new Error(nome+', capítulo '+(i+1)+': nas questões o título é "'+x.capitulo+'", na história é "'+c.t+'"');
   const o=Object.assign({},c,{q:x.perguntas||[]}); if(x.frases_extras) o.xs=x.frases_extras; return o;
  });
 };
 try{
  const ind=await get('indice');
  const [arcos,bonus,pr]=await Promise.all([
   Promise.all(ind.arcos.map(a=>Promise.all([get('historia/'+a),get('questoes/'+a)]).then(([h,q])=>({h,caps:junta(h,q,a)})))),
   Promise.all([get('historia/bonus'),get('questoes/bonus')]).then(([h,q])=>junta(h,q,'bonus')),
   Promise.all(['escuta','leitura','vocabulario','escrita','nivelamento','sons','confusoes','producao','simulados','imersao','conversa'].map(n=>get('pratica/'+n)))
  ]);
  const CH=[],ARCS=[],CANDO=[];
  arcos.forEach(({h,caps})=>{ARCS.push({n:h.nome,d:h.descricao,from:CH.length,to:CH.length+caps.length-1});CANDO.push(h.agora_voce_consegue||[]);CH.push(...caps);});
  Object.assign(window,{FILA_NOMES:ind.fila_nomes||null,CAMINHO:Array.isArray(ind.caminho)?ind.caminho:null,CH,ARCS,CANDO,BONUS:bonus,LISTEN:pr[0],READ:pr[1],VOCAB:pr[2],WRITE:pr[3],PLACE:pr[4],EAR_PAIRS:pr[5].pares,EAR_GLOSS:pr[5].traducao,CONFUSOES:pr[6],PRODUCAO:pr[7],SIMULADOS:pr[8],IMERSAO:pr[9],CONVERSA:pr[10],SOM_BANCO:pr[5].banco||[]});
 }catch(e){falha(e);return;}
 const s=document.createElement('script'); s.src='app.js?v='+TORRE_V;
 s.onerror=()=>falha(new Error('app.js não abriu')); document.body.appendChild(s);
})();
</script>

<script>
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persisted().then(p=>{if(!p) navigator.storage.persist();});}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){
 const had=!!navigator.serviceWorker.controller;

  if(!had||document.getElementById('upd')) return;
  const d=document.createElement('div');d.id='upd';d.setAttribute('role','status');
  d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;background:#1a1826;color:#fff;border:2px solid #62d6ff;border-radius:12px;padding:10px 14px;font:15px system-ui;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)';
  d.innerHTML='Nova versão do curso disponível. <button style="font:inherit;font-weight:700;padding:8px 12px;border-radius:8px;border:0;background:#ff8a3d;color:#111">Atualizar</button>';
  d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d);
 });
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v=db81f5942c').catch(()=>{});});
}
</script>
