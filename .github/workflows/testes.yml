name: Testes do curso
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/site/build_site.py --verificar
      - run: python tests/test_site.py
      - run: node tests/test_fonemas.js
