# Grava a voz de tudo o que é novo na prática: vocabulário, leituras e escutas (veja tools/vozes/vocabulario.py).
# Roda quando um lote chega numa branch vocabulario/... ou conteudo/...: grava em 6 partes paralelas, junta e envia o áudio
# para a mesma branch. Depois de conferida, a branch entra na main.
name: Vozes do conteúdo novo
on:
  push:
    branches: ['vocabulario/**', 'conteudo/**']
    paths: ['conteudo/pratica/vocabulario.json', 'conteudo/pratica/leitura.json', 'conteudo/pratica/escuta.json', 'conteudo/historia/**', 'conteudo/pratica/producao.json', 'conteudo/pratica/simulados.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vocabulario-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0-piper-2023.11.14-2
      - name: Baixar o Kokoro e o eSpeak (os mesmos arquivos das outras falas)
        run: bash tools/vozes/baixar_kokoro.sh ~/kokoro
      - run: pip install onnxruntime==1.29.0 numpy==2.5.3
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python tools/vozes/vocabulario.py gerar --parte ${{ matrix.parte }} --de 6 --grupo v${{ github.run_number }} --saida parte
        env:
          KOKORO_DIR: /home/runner/kokoro
      - uses: actions/upload-artifact@v4
        with:
          name: vocabulario-${{ matrix.parte }}
          path: parte
          retention-days: 3
  juntar:
    needs: gravar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: partes
          pattern: vocabulario-*
      - run: python tools/vozes/vocabulario.py juntar partes/*
      - run: python tools/site/build_site.py
      - name: Enviar o áudio para a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          git commit -m "Vozes do conteúdo novo gravadas" || exit 0
          # só o áudio entra no rebase; a marca de versão é refeita depois, sobre a versão mais nova da branch
          git checkout -- index.html sw.js
          git pull --rebase origin "${GITHUB_REF_NAME}"
          python tools/site/build_site.py
          git add -A index.html sw.js
          git commit -m "Marca de versão" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
